name: APK Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Herramientas Android
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt apksigner zipalign dalvik-exchange android-sdk-platform-23
      - run: npm ci
      - run: ./android/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: IslaBruma-apk
          path: dist/TheBruma.apk
